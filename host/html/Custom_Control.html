                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.controls || !Array.isArray(data.controls)) {
                            throw new Error('无效的布局文件');
                        }
                        pushSnapshot();
                        controls = data.controls.map(c => ({ ...c }));
                        nextId = data.nextId || (Math.max(...controls.map(c => c.id), 0) + 1);
                        buttonCounter = data.buttonCounter || 0;
                        switchCounter = data.switchCounter || 0;
                        // 重新计算计数器
                        controls.forEach(c => {
                            if (c.type === 'button') {
                                const match = c.name.match(/^按钮(\d+)$/);
                                if (match) buttonCounter = Math.max(buttonCounter, parseInt(match[1]));
                            } else if (c.type === 'switch') {
                                const match = c.name.match(/^开关(\d+)$/);
                                if (match) switchCounter = Math.max(switchCounter, parseInt(
                                    match[1]));
                            }
                            if (c.id >= nextId) nextId = c.id + 1;
                        });
                        renderAllControls();
                        updateUndoRedoButtons();
                        setStatus('已导入布局文件');
                    } catch (err) {
                        alert('导入失败：文件格式无效');
                        setStatus('导入失败');
                    }
                };
                reader.readAsText(file);
                importFileInput.value = '';
            });

            document.getElementById('btnSave').addEventListener('click', function() {
                const saveData = {
                    version: '1.0',
                    controls: cloneControls(),
                    nextId: nextId,
                    buttonCounter: buttonCounter,
                    switchCounter: switchCounter,
                    savedAt: new Date().toISOString(),
                };
                // 保存到后端持久化存储
                sendWs('storage:save', { key: 'controlLayout', value: saveData });
                // 同时也保存到 localStorage 作为辅助
                try {
                    localStorage.setItem('control-designer-save', JSON.stringify(saveData));
                } catch (err) {}
                setStatus('已保存到本地缓存');
            });

            // ==================== 侧边栏按钮事件 ====================
            document.getElementById('sideAdd').addEventListener('click', function() {
                // 如果正在放置模式，取消
                if (currentMode === 'placing') {
                    exitPlacingMode();
                    return;
                }
                setMode('default');
                showAddControlModal();
            });

            document.getElementById('sideEdit').addEventListener('click', function() {
                setMode('edit');
                if (currentMode === 'edit') {
                    setStatus('编辑模式：左键点击控件进行编辑');
                }
            });

            document.getElementById('sideDelete').addEventListener('click', function() {
                setMode('delete');
                if (currentMode === 'delete') {
                    setStatus('删除模式：点击控件进行删除');
                }
            });

            document.getElementById('sideMove').addEventListener('click', function() {
                setMode('move');
                if (currentMode === 'move') {
                    setStatus('移动模式：拖动控件来调整位置');
                }
            });

            document.getElementById('sideResize').addEventListener('click', function() {
                setMode('resize');
                if (currentMode === 'resize') {
                    setStatus('缩放模式：拖动控件边缘来调整大小');
                }
            });

            document.getElementById('sideRotate').addEventListener('click', function() {
                setMode('rotate');
                if (currentMode === 'rotate') {
                    setStatus('旋转模式：拖动控件边缘来调整角度');
                }
            });

            document.getElementById('sideSnap').addEventListener('click', function() {
                snapEnabled = !snapEnabled;
                const btn = document.getElementById('sideSnap');
                if (snapEnabled) {
                    btn.classList.add('snap-active');
                    setStatus('自动吸附已开启');
                } else {
                    btn.classList.remove('snap-active');
                    clearSnapGuides();
                    setStatus('自动吸附已关闭');
                }
            });

            // ==================== 推荐参数查询 ====================
            document.getElementById('sideQueryParams').addEventListener('click', function() {
                // 发送 0x0F 查询运动极限参数（无 payload）
                sendWs('control:sendCmd', { cmd: 0x0F, payload: [] });
                setStatus('已发送运动参数查询请求...', 'info');
            });

            // ==================== 调整大小模式下的光标提示 ====================
            board.addEventListener('mousemove', function(e) {
                if (currentMode === 'resize' && !isDragging) {
                    const controlEl = e.target.closest('.board-control');
                    if (controlEl) {
                        const controlId = parseInt(controlEl.dataset.controlId);
                        const control = getControlById(controlId);
                        if (control) {
                            const edgeInfo = detectEdge(e, control, controlEl);
                            if (edgeInfo && edgeInfo.isEdge) {
                                document.body.style.cursor = getResizeCursor(edgeInfo);
                            } else if (edgeInfo) {
                                document.body.style.cursor = 'default';
                            } else {
                                document.body.style.cursor = 'default';
                            }
                        }
                    } else {
                        document.body.style.cursor = '';
                    }
                } else if (currentMode === 'rotate' && !isDragging) {
                    const controlEl = e.target.closest('.board-control');
                    if (controlEl) {
                        document.body.style.cursor = 'grab';
                    } else {
                        document.body.style.cursor = '';
                    }
                } else if (!isDragging && (currentMode === 'default' || currentMode === 'add')) {
                    document.body.style.cursor = '';
                }
            });

            // ==================== 初始化 ====================
            function loadSavedData() {
                try {
                    const saved = localStorage.getItem('control-designer-save');
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.controls && Array.isArray(data.controls)) {
                            controls = data.controls.map(c => ({ ...c }));
                            nextId = data.nextId || (Math.max(...controls.map(c => c.id), 0) + 1);
                            buttonCounter = data.buttonCounter || 0;
                            switchCounter = data.switchCounter || 0;
                            controls.forEach(c => {
                                if (c.type === 'button') {
                                    const match = c.name.match(/^按钮(\d+)$/);
                                    if (match) buttonCounter = Math.max(buttonCounter, parseInt(match[1]));
                                } else if (c.type === 'switch') {
                                    const match = c.name.match(/^开关(\d+)$/);
                                    if (match) switchCounter = Math.max(switchCounter, parseInt(match[1]));
                                }
                                if (c.id >= nextId) nextId = c.id + 1;
                            });
                            setStatus('已加载保存的布局');
                        }
                    }
                } catch (err) {
                    console.log('加载保存数据失败', err);
                }
                renderAllControls();
                updateUndoRedoButtons();
                updateSidebarActiveState();
            }

            // 初始快照
            loadSavedData();
            if (controls.length > 0 && undoStack.length === 0) {
                // 初始加载后保存一个快照用于撤销
                undoStack.push(cloneControls());
                updateUndoRedoButtons();
            }
            if (controls.length === 0 && undoStack.length === 0) {
                undoStack.push([]);
                updateUndoRedoButtons();
            }

            // 关闭所有弹窗的全局点击
            document.addEventListener('click', function(e) {
                // 不再自动关闭：弹窗仅通过取消按钮关闭
            });

            console.log('✅ 自定义控件设计器已就绪');
            // 默认开启自动吸附
            document.getElementById('sideSnap').classList.add('snap-active');
            console.log('   - 自动吸附：已默认开启');
            console.log('   - 左侧工具栏：添加/编辑/删除/移动/缩放/旋转');
            console.log('   - 右键菜单：默认模式下右键白板');
            console.log('   - 快捷键：Esc退出模式 | Ctrl+Z撤销 | Ctrl+Y恢复');
            console.log('   - 导出格式：JSON文件');
            console.log('   - 后端通信：WebSocket IPC');

            // 启动时不发送 storage:load（WS 尚未连接，会被静默丢弃但产生无意义 [请求] 日志）
            // 改为在 ws:connected 事件中发送（见下方消息监听器）

            // ==================== 接收后端消息 ====================
            window.addEventListener('message', function(e) {
                const data = e.data;
                if (!data || typeof data !== 'object') return;

                // 直接消息（来自框架转发的协议包，非 ws-event 包裹）
                if (data.type === 'control:motionParams') {
                    _showMotionParamsModal(data.data);
                    return;
                }

                if (data.type === 'ws-event') {
                    const { eventType, data: eventData } = data;

                    if (eventType === 'ws:connected') {
                        sendWs('storage:load', { key: 'controlLayout' });
                    } else if (eventType === 'ble:status') {
                        updateBleBadge(eventData);
                    } else if (eventType === 'error' && eventData.type && eventData.type.startsWith('control:')) {
                        setStatus('发送失败: ' + eventData.message, 'error');
                    } else if (eventType === 'storage:loaded' && eventData.key === 'controlLayout' && eventData.value) {
                        try {
                            const saveData = eventData.value;
                            if (saveData.controls && Array.isArray(saveData.controls)) {
                                pushSnapshot();
                                controls = saveData.controls.map(c => ({ ...c }));
                                nextId = saveData.nextId || (Math.max(...controls.map(c => c.id), 0) + 1);
                                buttonCounter = saveData.buttonCounter || 0;
                                switchCounter = saveData.switchCounter || 0;
                                renderAllControls();
                                updateUndoRedoButtons();
                                setStatus('已从后端加载布局');
                            }
                        } catch (err) {
                            console.error('加载布局失败:', err);
                        }
                    }
                }
            });

            // ==================== 运动参数弹窗 ====================
            function _showMotionParamsModal(rawData) {
                const raw = rawData.rawBytes || [];
                if (raw.length < 22) {
                    setStatus('运动参数数据不完整（需要22字节，收到' + raw.length + '字节）', 'error');
                    return;
                }

                // 解析 IEEE 754 单精度浮点（小端序）
                function readFloatLE(arr, offset) {
                    const buf = new ArrayBuffer(4);
                    const view = new DataView(buf);
                    view.setUint8(0, arr[offset]);
                    view.setUint8(1, arr[offset + 1]);
                    view.setUint8(2, arr[offset + 2]);
                    view.setUint8(3, arr[offset + 3]);
                    return view.getFloat32(0, true); // little-endian
                }

                // 解析 uint16 小端序
                function readUint16LE(arr, offset) {
                    return arr[offset] | (arr[offset + 1] << 8);
                }

                const aMax = readFloatLE(raw, 0);
                const vMax = readFloatLE(raw, 4);
                const lambdaMin = readFloatLE(raw, 8);
                const lambdaMax = readFloatLE(raw, 12);
                const lambdaCur = readFloatLE(raw, 16);
                const sineTime = readUint16LE(raw, 20);

                // 构建弹窗
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal" style="width:420px;">
                        <div class="modal-header">
                            <span class="gear-icon">📊</span>
                            <span class="modal-title">运动极限参数</span>
                        </div>
                        <div class="modal-body" style="padding:20px 24px;">
                            <table style="width:100%;border-collapse:collapse;font-size:14px;">
                                <thead>
                                    <tr style="border-bottom:2px solid #e0e0e0;">
                                        <th style="text-align:left;padding:8px 6px;color:#555;">参数</th>
                                        <th style="text-align:right;padding:8px 6px;color:#555;">值</th>
                                        <th style="text-align:right;padding:8px 6px;color:#888;font-weight:normal;">单位</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr style="border-bottom:1px solid #f0f0f0;">
                                        <td style="padding:10px 6px;font-weight:500;">A<sub>max</sub> 最大振幅</td>
                                        <td style="text-align:right;padding:10px 6px;font-family:monospace;font-size:15px;color:#1a73e8;">${aMax.toFixed(1)}</td>
                                        <td style="text-align:right;padding:10px 6px;color:#999;">度</td>
                                    </tr>
                                    <tr style="border-bottom:1px solid #f0f0f0;">
                                        <td style="padding:10px 6px;font-weight:500;">V<sub>max</sub> 最大波速</td>
                                        <td style="text-align:right;padding:10px 6px;font-family:monospace;font-size:15px;color:#1a73e8;">${vMax.toFixed(1)}</td>
                                        <td style="text-align:right;padding:10px 6px;color:#999;">关节间隔/秒</td>
                                    </tr>
                                    <tr style="border-bottom:1px solid #f0f0f0;">
                                        <td style="padding:10px 6px;font-weight:500;">λ<sub>min</sub> 波长下限</td>
                                        <td style="text-align:right;padding:10px 6px;font-family:monospace;font-size:15px;color:#1a73e8;">${lambdaMin.toFixed(1)}</td>
                                        <td style="text-align:right;padding:10px 6px;color:#999;">关节间隔数</td>
                                    </tr>
                                    <tr style="border-bottom:1px solid #f0f0f0;">
                                        <td style="padding:10px 6px;font-weight:500;">λ<sub>max</sub> 波长上限</td>
                                        <td style="text-align:right;padding:10px 6px;font-family:monospace;font-size:15px;color:#1a73e8;">${lambdaMax.toFixed(1)}</td>
                                        <td style="text-align:right;padding:10px 6px;color:#999;">关节间隔数</td>
                                    </tr>
                                    <tr style="border-bottom:1px solid #f0f0f0;">
                                        <td style="padding:10px 6px;font-weight:500;">λ<sub>cur</sub> 当前波长</td>
                                        <td style="text-align:right;padding:10px 6px;font-family:monospace;font-size:15px;color:#0d652d;">${lambdaCur.toFixed(1)}</td>
                                        <td style="text-align:right;padding:10px 6px;color:#999;">关节间隔数</td>
                                    </tr>
                                    <tr>
                                        <td style="padding:10px 6px;font-weight:500;">正弦步态时间</td>
                                        <td style="text-align:right;padding:10px 6px;font-family:monospace;font-size:15px;color:#0d652d;">${sineTime}</td>
                                        <td style="text-align:right;padding:10px 6px;color:#999;">ms</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-primary" id="motionParamsClose">确定</button>
                        </div>
                    </div>
                `;
                modalContainer.appendChild(overlay);

                document.getElementById('motionParamsClose').addEventListener('click', function() {
                    modalContainer.innerHTML = '';
                });

                setStatus(`运动参数: A_max=${aMax.toFixed(1)}°, V_max=${vMax.toFixed(1)}, λ=[${lambdaMin.toFixed(1)}~${lambdaMax.toFixed(1)}], λ_cur=${lambdaCur.toFixed(1)}, time=${sineTime}ms`, 'success');
            }

            // 此外也尝试从 localStorage 加载
            try {
                const saved = localStorage.getItem('control-designer-save');
                if (saved) {
                    const saveData = JSON.parse(saved);
                    if (saveData.controls && Array.isArray(saveData.controls)) {
                        controls = saveData.controls.map(c => ({ ...c }));
                        nextId = saveData.nextId || (Math.max(...controls.map(c => c.id), 0) + 1);
                        buttonCounter = saveData.buttonCounter || 0;
                        switchCounter = saveData.switchCounter || 0;
                        renderAllControls();
                        updateUndoRedoButtons();
                        setStatus('已从本地缓存加载布局');
                    }
                }
            } catch (err) {}
        })();
    </script>
</body>
</html>
